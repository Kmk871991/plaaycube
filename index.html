<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Playcube 2v2 FIFA Challenge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    option.booked {
      background-color: #f87171; /* red */
      color: white;
    }
    option.waitlist {
      background-color: #facc15; /* yellow */
      color: black;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-900 to-black text-white font-sans">
  <!-- Hero Section -->
  <div class="text-center py-20 px-6 bg-[url('https://images.unsplash.com/photo-1606813909028-00801944aa1b?ixlib=rb-4.0.3&auto=format&fit=crop&w=1950&q=80')] bg-cover bg-center">
    <h1 class="text-5xl font-bold drop-shadow-md">🎮 Playcube 2v2 FIFA Challenge</h1>
    <p class="mt-4 text-lg text-gray-200 max-w-xl mx-auto">Test your teamwork and take the crown in a high-intensity FIFA match. ₹100 per player · Best of 5 Matches · 45 minutes.</p>
    <button onclick="document.getElementById('registerSection').scrollIntoView({ behavior: 'smooth' });" class="mt-8 px-8 py-3 bg-green-500 hover:bg-green-600 rounded-xl text-lg font-semibold shadow-lg transition">Register Now</button>
  </div>

  <!-- Registration Form -->
  <section id="registerSection" class="max-w-xl mx-auto p-6 mt-20 bg-gray-800 rounded-2xl shadow-2xl">
    <h2 class="text-3xl font-bold mb-4 text-center">📝 Team Registration</h2>
    <form id="bookingForm" class="space-y-4">
      <input type="text" name="team_name" placeholder="Team Name" required class="w-full p-2 rounded bg-gray-700 text-white"/>
      <input type="text" name="player1" placeholder="Player 1 Name" required class="w-full p-2 rounded bg-gray-700 text-white"/>
      <input type="email" name="player1_email" placeholder="Player 1 Email" required class="w-full p-2 rounded bg-gray-700 text-white"/>
      <input type="text" name="player2" placeholder="Player 2 Name" required class="w-full p-2 rounded bg-gray-700 text-white"/>
      <input type="email" name="player2_email" placeholder="Player 2 Email" required class="w-full p-2 rounded bg-gray-700 text-white"/>

      <label class="block text-sm">Select Date</label>
      <input type="date" name="date" id="datePicker" required class="w-full p-2 rounded bg-gray-700 text-white"/>

      <label class="block text-sm">Select Time Slot</label>
      <select name="slot" id="timeSlot" required class="w-full p-2 rounded bg-gray-700 text-white"></select>

      <div id="slotMessage" class="text-sm text-yellow-400"></div>

      <div class="flex justify-center">
        <button type="submit" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-6 rounded-xl text-lg mt-4">
          Continue to Pay
        </button>
      </div>
    </form>
  </section>

  <footer class="mt-20 text-center text-sm text-gray-400">
    📍 Playcube Gaming Hub · Chennai · Contact: +91-XXXXXXXXXX
  </footer>

  <script>
    const bookedSlots = {
      "2025-07-18": ["10:00 - 10:45", "11:00 - 11:45"],
      "2025-07-19": ["15:00 - 15:45"]
    };

    const waitlistCapacity = 2;
    const datePicker = document.getElementById("datePicker");
    const timeSlot = document.getElementById("timeSlot");
    const slotMessage = document.getElementById("slotMessage");

    document.addEventListener("DOMContentLoaded", () => {
      const today = new Date().toISOString().split("T")[0];
      datePicker.min = today;
    });

    datePicker.addEventListener("change", () => {
      populateTimeSlots(datePicker.value);
    });

    function populateTimeSlots(selectedDate) {
      timeSlot.innerHTML = "";
      slotMessage.innerText = "";

      const booked = bookedSlots[selectedDate] || [];
      for (let h = 10; h < 21; h++) {
        if (h === 13) continue;
        const slot = `${String(h).padStart(2, "0")}:00 - ${String(h).padStart(2, "0")}:45`;
        const isBooked = booked.includes(slot);

        const option = document.createElement("option");
        option.value = slot;
        option.textContent = slot + (isBooked ? " (Booked)" : "");
        option.className = isBooked ? "booked" : "available";
        option.dataset.status = isBooked ? "booked" : "available";

        timeSlot.appendChild(option);
      }
    }

    timeSlot.addEventListener("change", () => {
      const selectedOption = timeSlot.options[timeSlot.selectedIndex];
      const status = selectedOption.dataset.status;
      if (status === "booked") {
        slotMessage.innerText = "⚠ This slot is already booked. You will be added to the waitlist. You may also try another time.";
      } else {
        slotMessage.innerText = "";
      }
    });

    document.getElementById("bookingForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const slotStatus = timeSlot.options[timeSlot.selectedIndex].dataset.status;
      if (slotStatus === "booked") {
        alert("You are being waitlisted for this slot. If it opens, we will notify you 3 days in advance.");
      } else {
        alert("Booking confirmed! Redirecting to payment...");
      }

      window.location.href = "https://rzp.io/l/your-razorpay-link";
    });
  </script>
</body>
</html>
