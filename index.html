<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Playcube 2v2 FIFA Challenge</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans">

  <div class="max-w-xl mx-auto p-6 mt-10 bg-gray-800 rounded-2xl shadow-xl">
    <h1 class="text-3xl font-bold mb-4 text-center">⚽ Playcube 2v2 FIFA Challenge</h1>
    <p class="text-center text-lg mb-6">
      ₹100 per player · Best of 5 Matches · 45 mins of high-intensity FIFA action
    </p>

    <form id="registrationForm" class="space-y-4">
      <input type="text" name="team_name" placeholder="Team Name" required class="w-full p-2 rounded bg-gray-700 text-white"/>
      <input type="text" name="player1_name" placeholder="Player 1 Name" required class="w-full p-2 rounded bg-gray-700 text-white"/>
      <input type="email" name="player1_email" placeholder="Player 1 Email" required class="w-full p-2 rounded bg-gray-700 text-white"/>
      <input type="text" name="player2_name" placeholder="Player 2 Name" required class="w-full p-2 rounded bg-gray-700 text-white"/>
      <input type="email" name="player2_email" placeholder="Player 2 Email" required class="w-full p-2 rounded bg-gray-700 text-white"/>

      <!-- Date Picker -->
      <div>
        <label class="block text-sm mb-1">Select Date</label>
        <input type="date" name="play_date" id="play_date" required class="w-full p-2 rounded bg-gray-700 text-white"/>
      </div>

      <!-- Time Slot Selector -->
      <div>
        <label class="block text-sm mb-1">Choose Time Slot (45 mins)</label>
        <select name="time_slot" id="time_slot" required class="w-full p-2 rounded bg-gray-700 text-white">
          <!-- Populated by JS -->
        </select>
      </div>

      <p class="text-sm text-gray-300 mt-4">
        💡 After submitting, you'll be redirected to complete payment and confirm your slot.
      </p>

      <div class="flex justify-center">
        <button type="submit" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-6 rounded-xl text-lg mt-4">
          Pay ₹200 & Book
        </button>
      </div>
    </form>
  </div>

  <footer class="mt-10 text-center text-sm text-gray-400">
    📍 Playcube Gaming Hub · Chennai · Contact: +91-XXXXXXXXXX
  </footer>

  <script>
    // Set today's date as minimum
    document.addEventListener("DOMContentLoaded", () => {
      const dateInput = document.getElementById("play_date");
      const today = new Date().toISOString().split("T")[0];
      dateInput.min = today;

      const slotSelector = document.getElementById("time_slot");

      const generateTimeSlots = () => {
        const slots = [];
        let startHour = 10;
        let endHour = 21;

        for (let h = startHour; h < endHour; h++) {
          if (h === 13) continue; // skip 1PM
          const start = `${String(h).padStart(2, "0")}:00`;
          const end = `${String(h).padStart(2, "0")}:45`;
          slots.push(`${start} - ${end}`);
        }

        slotSelector.innerHTML = slots.map(slot => `<option value="${slot}">${slot}</option>`).join("");
      };

      generateTimeSlots();
    });

    // Handle form submission
    document.getElementById('registrationForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const form = e.target;
      const data = {
        team: form.team_name.value,
        p1: form.player1_name.value,
        p1email: form.player1_email.value,
        p2: form.player2_name.value,
        p2email: form.player2_email.value,
        date: form.play_date.value,
        time: form.time_slot.value
      };

      if (Object.values(data).some(val => !val)) {
        alert('Please fill all fields!');
        return;
      }

      // TODO: Send data to Google Sheets, backend, etc. before payment if needed

      // Redirect to payment (replace with your Razorpay link)
      const paymentURL = "https://rzp.io/l/your-razorpay-link";  // <--- Replace with real link
      window.location.href = paymentURL;
    });
  </script>
</body>
</html>
